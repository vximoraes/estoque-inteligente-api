stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.20
  resource_group: producao
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - (cat "$DEPLOY_SSH_KEY"; echo) > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - ssh -T -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
