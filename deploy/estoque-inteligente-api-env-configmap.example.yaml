apiVersion: v1
kind: ConfigMap
metadata:
  name: estoque-inteligente-env
  labels:
    io.kompose.service: estoque-inteligente
data:
  # =============================================================================
  # CONFIGURAÇÕES DA API
  # =============================================================================
  PORT: '3010'
  NODE_ENV: 'production'
  DEBUGLOG: 'false'

  # =============================================================================
  # URLs
  # =============================================================================
  BASE_URL: 'https://estoque-inteligente-api.app.fslab.dev'
  FRONTEND_URL: 'https://estoque-inteligente.app.fslab.dev'

  # =============================================================================
  # CONFIGURAÇÕES DO BANCO DE DADOS
  # =============================================================================
  DB_URL: 'mongodb://estoque-inteligente-mongodb:27017/estoque-inteligente'
  DB_URL_TEST: 'mongodb://estoque-inteligente-mongodb:27017/estoque-inteligente-test'

  # =============================================================================
  # CONFIGURAÇÕES JWT
  # =============================================================================
  JWT_SECRET_ACCESS_TOKEN: '<REPLACE_WITH_SECURE_VALUE>'
  JWT_SECRET_REFRESH_TOKEN: '<REPLACE_WITH_SECURE_VALUE>'
  JWT_SECRET_PASSWORD_RECOVERY: '<REPLACE_WITH_SECURE_VALUE>'
  JWT_SECRET_INVITE: '<REPLACE_WITH_SECURE_VALUE>'
  JWT_ACCESS_TOKEN_EXPIRATION: '1d'
  JWT_REFRESH_TOKEN_EXPIRATION: '7d'

  # =============================================================================
  # CONFIGURAÇÕES DO SERVIÇO DE E-MAIL
  # =============================================================================
  EMAIL_USER: '<REPLACE_WITH_EMAIL>'
  EMAIL_APP_PASSWORD: '<REPLACE_WITH_EMAIL_APP_PASSWORD>'
  COMPANY_NAME: 'Estoque Inteligente'

  # =============================================================================
  # CONFIGURAÇÕES DO MINIO
  # =============================================================================
  MINIO_ENDPOINT: 'minio.exemplo'
  MINIO_PORT: '443'
  MINIO_USE_SSL: 'true'
  MINIO_ACCESS_KEY: '<REPLACE_WITH_MINIO_ACCESS_KEY>'
  MINIO_SECRET_KEY: '<REPLACE_WITH_MINIO_SECRET_KEY>'
  MINIO_BUCKET: 'usuarios'
  MINIO_BUCKET_2: 'itens'
  MINIO_PUBLIC_URL: 'https://minio.exemplo'

  # =============================================================================
  # CONFIGURAÇÕES DO MONGODB
  # =============================================================================
  MONGO_INITDB_DATABASE: 'estoque-inteligente'
  MONGO_INITDB_ROOT_USERNAME: '<REPLACE_WITH_MONGO_ROOT_USER>'
  MONGO_INITDB_ROOT_PASSWORD: '<REPLACE_WITH_MONGO_ROOT_PASSWORD>'

  # =============================================================================
  # CONFIGURAÇÕES DO ADMINISTRADOR
  # =============================================================================
  ADMIN_NAME: 'Administrador'
  ADMIN_EMAIL: 'admin@admin.com'
  ADMIN_PASSWORD: '<REPLACE_WITH_ADMIN_PASSWORD>'

  # =============================================================================
  # CONFIGURAÇÕES DA IA
  # =============================================================================
  GEMINI_API_KEY: '<REPLACE_WITH_GEMINI_API_KEY>'
  # URL interna que o IAService usa para conectar ao MCP server (loopback)
  # Em produção com Docker, usar o nome do serviço: http://estoque-inteligente-api:3010
  API_INTERNAL_URL: 'http://localhost:3010'
  # Modelo do Gemini usado pelo agente. gemini-2.5-flash tem shutdown anunciado
  # para 2026-10-16 — não usar como default.
  GEMINI_MODEL: 'gemini-3.5-flash-lite'
  # Teto de tokens de saída por chamada ao modelo (contenção de custo)
  IA_MAX_OUTPUT_TOKENS: '1536'
  # 0 desativa o "thinking" do Gemini (cobrado como output, invisível ao usuário)
  IA_THINKING_BUDGET: '0'
  # Nº máximo de passos do agente ReAct por mensagem
  IA_RECURSION_LIMIT: '6'
  # Timeout de uma resposta do agente, em milissegundos
  IA_TIMEOUT_MS: '45000'
